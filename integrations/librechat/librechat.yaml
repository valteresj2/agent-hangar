# LibreChat com o agente Data Studio do Agent Hangar como "motor" (endpoint customizado OpenAI-compatible).
# Referência: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.13
cache: true

interface:
  customWelcome: "Data Studio: anexe planilhas, CSV, PDFs ou imagens e peça análises, dashboards, apresentações ou planilhas editadas."
  modelSelect: true
  parameters: false
  presets: false
  prompts: true
  bookmarks: true
  agents: false          # o "agente" aqui é o do Agent Hangar; o construtor de agentes do LibreChat fica oculto

modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: data-studio
      label: "Data Studio"
      description: "Análise de dados com Python e DuckDB, dashboards HTML e apresentações PPTX/HTML"
      default: true
      preset:
        endpoint: "Agent Hangar"
        model: "data-studio"
        resendFiles: true   # reenvia anexos nos turnos seguintes (o workspace deduplica pelo conteúdo)

endpoints:
  custom:
    - name: "Agent Hangar"
      # Chave de consumo (escopo invoke, só este agente): `hangar keys create librechat --scope invoke --agent data-studio`
      apiKey: "${HANGAR_INVOKE_KEY}"
      baseURL: "${HANGAR_BASE_URL}/gw/data-studio/v1"
      models:
        default: ["data-studio"]
        fetch: false
      modelDisplayLabel: "Data Studio"
      titleConvo: true
      titleModel: "data-studio"
      summarize: false
      # O id da conversa vira a sessão do agente: cada conversa tem seu workspace de arquivos e kernel Python.
      headers:
        X-Channel: "librechat"
        X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-User-Id: "{{LIBRECHAT_USER_ID}}"
      dropParams: ["stop", "frequency_penalty", "presence_penalty", "top_p", "user"]

fileConfig:
  endpoints:
    "Agent Hangar":
      # Anexos vão ao agente como arquivos (base64 no formato OpenAI) e são gravados no workspace da conversa.
      fileLimit: 10
      fileSizeLimit: 50        # MB por arquivo
      totalSizeLimit: 200      # MB por mensagem
      supportedMimeTypes:
        - "^image/.*"
        - "^text/.*"
        - "^application/pdf$"
        - "^application/json$"
        - "^application/vnd\\.ms-excel$"
        - "^application/vnd\\.openxmlformats-officedocument\\..*$"
        - "^application/vnd\\.apache\\.parquet$"
        - "^application/octet-stream$"
  serverFileSizeLimit: 200

# Alternativa: usar o agente como FERRAMENTA dentro dos Agents do próprio LibreChat (via MCP), em vez de motor.
