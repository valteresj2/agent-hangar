# Porta pública do Activepieces (UI, login e tela de consentimento do OAuth).
# O Activepieces monta as URLs de redirecionamento a partir de X-Forwarded-Host; sem ele usa o hostname SEM a porta
# (ex.: http://localhost/mcp-authorize em vez de http://localhost:8098/...). Aqui repassamos o host com a porta.
server {
    listen 80;
    client_max_body_size 50m;
    location / {
        proxy_pass http://activepieces:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
