{{- if .Values.externalSecrets.enabled }}
{{- $e := .Values.externalSecrets -}}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "hangar.fullname" . }}-secrets
  labels: {{- include "hangar.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name é obrigatório" $e.secretStoreRef.name }}
    kind: {{ $e.secretStoreRef.kind }}
  target:
    name: {{ include "hangar.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain          # apagar o ExternalSecret não apaga o Secret (a chave Fernet decifra o banco)
  {{- if $e.remoteKey }}
  dataFrom:
    - extract: {key: {{ $e.remoteKey | quote }}}
  {{- end }}
  {{- with $e.data }}
  data: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and (not $e.remoteKey) (not $e.data) }}
  {{- fail "externalSecrets: informe remoteKey (um segredo JSON com todas as chaves) ou data (chave a chave)" }}
  {{- end }}
{{- end }}
