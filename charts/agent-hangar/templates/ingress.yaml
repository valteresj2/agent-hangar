{{- if .Values.ingress.enabled }}
{{- $full := include "hangar.fullname" . -}}
{{- $host := required "ingress.host é obrigatório" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels: {{- include "hangar.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.gkeManagedCertificate }}
    networking.gke.io/managed-certificates: {{ $full }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled (not .Values.ingress.gkeManagedCertificate) }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $full) }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-central
                port: {number: 8080}
{{- if .Values.ingress.gkeManagedCertificate }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ $full }}
  labels: {{- include "hangar.labels" . | nindent 4 }}
spec:
  domains: [{{ $host | quote }}]
{{- end }}
{{- end }}
