{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- $full := include "hangar.fullname" . -}}
{{- $pg := include "hangar.secret" (dict "ctx" . "key" "POSTGRES_PASSWORD" "value" .Values.postgresql.password "kind" "hex") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-secrets
  labels: {{- include "hangar.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # desinstalar não apaga os segredos (a chave Fernet decifra o banco)
type: Opaque
stringData:
  ADMIN_TOKEN: {{ include "hangar.secret" (dict "ctx" . "key" "ADMIN_TOKEN" "value" .Values.secrets.adminToken "kind" "hex") | quote }}
  HANGAR_SECRET_KEY: {{ include "hangar.secret" (dict "ctx" . "key" "HANGAR_SECRET_KEY" "value" .Values.secrets.secretKey "kind" "fernet") | quote }}
  INTERNAL_SECRET: {{ include "hangar.secret" (dict "ctx" . "key" "INTERNAL_SECRET" "value" .Values.secrets.internalSecret "kind" "hex") | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pg | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://hangar:%s@%s-postgres:5432/hangar" $pg $full | quote }}
  {{- else if .Values.postgresql.external.url }}
  DATABASE_URL: {{ .Values.postgresql.external.url | quote }}
  {{- end }}
  {{- if .Values.memory.enabled }}
  MEMORY_TOKEN: {{ include "hangar.secret" (dict "ctx" . "key" "MEMORY_TOKEN" "value" "" "kind" "hex") | quote }}
  NEO4J_PASSWORD: {{ include "hangar.secret" (dict "ctx" . "key" "NEO4J_PASSWORD" "value" .Values.memory.neo4j.password "kind" "hex") | quote }}
  FALKORDB_PASSWORD: {{ include "hangar.secret" (dict "ctx" . "key" "FALKORDB_PASSWORD" "value" .Values.memory.falkordb.password "kind" "hex") | quote }}
  {{- end }}
  {{- if .Values.tunnel.cloudflare.enabled }}
  CLOUDFLARE_TUNNEL_TOKEN: {{ required "tunnel.cloudflare.token é obrigatório" .Values.tunnel.cloudflare.token | quote }}
  {{- end }}
  {{- range $p, $key := dict "google" "OAUTH_GOOGLE" "microsoft" "OAUTH_MICROSOFT" "github" "OAUTH_GITHUB" "oauth2" "OAUTH_OAUTH2" }}
  {{- with (index $.Values.sso $p).clientSecret }}
  {{ $key }}_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
