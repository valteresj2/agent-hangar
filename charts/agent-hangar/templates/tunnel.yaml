{{- if .Values.tunnel.cloudflare.enabled }}
{{- $full := include "hangar.fullname" . -}}
# Cloudflare Tunnel: HTTPS público sem load balancer nem IP público. No Zero Trust, o Public Hostname do túnel
# aponta para http://{{ $full }}-central:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-cloudflared
  labels: {{- include "hangar.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  replicas: 2   # o cloudflared balanceia entre as réplicas: uma cai, a outra segura
  selector:
    matchLabels: {{- include "hangar.selector" . | nindent 6 }}
      app.kubernetes.io/component: tunnel
  template:
    metadata:
      labels: {{- include "hangar.selector" . | nindent 8 }}
        app.kubernetes.io/component: tunnel
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: cloudflared
          image: {{ .Values.tunnel.cloudflare.image }}
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hangar.secretName" . }}, key: CLOUDFLARE_TUNNEL_TOKEN}}
          securityContext: {{- include "hangar.containerSecurity" . | nindent 12 }}
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
{{- end }}
