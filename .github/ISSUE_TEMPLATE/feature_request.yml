name: Feature request
description: Suggest an improvement or a new integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could Agent Hangar solve it? API, UI or MCP tool sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
