name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central/requirements.txt
      - run: pip install -r central/requirements.txt pytest ruff -e ./cli
      - run: ruff check .
      - run: pytest
      - name: Check JS syntax
        run: |
          node --check central/app/static/app.js
          node --check harness/entrypoint.js

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure
        run: ./scripts/setup.sh
      - name: Build and start (mock mode, no harness CLIs)
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:8090/api/health && exit 0; sleep 2; done
          docker compose logs central; exit 1
      - name: Smoke test
        run: |
          pip install httpx
          HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) python tests/e2e/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 central
