name: agent-hangar

# Imagens: `docker compose up -d --build` builda a central, o runtime dos agentes e o harness base (mock).
# Harnesses reais são opt-in (imagens grandes):
#   docker compose --profile harness build     # claude-code, codex, deepseek-harness
#   docker compose --profile hermes build      # hermes (instalador próprio, mais lento)
# Ou use as imagens publicadas: HANGAR_REGISTRY=ghcr.io/<owner> + HANGAR_VERSION=<tag>.

x-build-only: &build-only
  command: ["true"]
  restart: "no"
  network_mode: none

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hangar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/setup.sh para gerar o .env}
      POSTGRES_DB: ${POSTGRES_DB:-hangar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hangar}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # rede só da central: agentes (que executam tools e, no Data Studio, Python arbitrário) não alcançam o banco
    networks: [db_net]

  # A central nunca monta o docker.sock: fala com este proxy, que só libera a API de containers
  # (criar/listar/parar/remover/logs), volumes e redes — sem exec, build, pull, images, swarm, secrets.
  # Veja docs/security.md para o que isso protege e o que NÃO protege.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 0
      EXEC: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_api]
    restart: unless-stopped

  # --- imagens (build-only: o container só existe para o compose buildar a imagem) ---
  agent-runtime:
    <<: *build-only
    image: ${HANGAR_REGISTRY:-agent-hangar}/agent-runtime:${HANGAR_VERSION:-latest}
    build: ./runtime

  harness-base:
    <<: *build-only
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-base:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: base }

  harness-claude-code:
    <<: *build-only
    profiles: [harness]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-claude-code:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: claude-code }

  harness-codex:
    <<: *build-only
    profiles: [harness]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-codex:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: codex }

  harness-deepseek-harness:
    <<: *build-only
    profiles: [harness]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-deepseek-harness:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: deepseek-harness }

  harness-hermes:
    <<: *build-only
    profiles: [hermes]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-hermes:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: hermes }

  central:
    image: ${HANGAR_REGISTRY:-agent-hangar}/central:${HANGAR_VERSION:-latest}
    build: { context: ., dockerfile: central/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      docker-proxy: { condition: service_started }
      agent-runtime: { condition: service_completed_successfully }
      harness-base: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hangar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hangar}
      DOCKER_HOST: tcp://docker-proxy:2375
      ADMIN_TOKEN: ${ADMIN_TOKEN:?rode scripts/setup.sh para gerar o .env}
      HANGAR_SECRET_KEY: ${HANGAR_SECRET_KEY:?rode scripts/setup.sh para gerar o .env}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?rode scripts/setup.sh para gerar o .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8090}
      INTERNAL_BASE_URL: http://central:8080
      HANGAR_REGISTRY: ${HANGAR_REGISTRY:-agent-hangar}
      HANGAR_VERSION: ${HANGAR_VERSION:-latest}
      AGENTS_NETWORK: hangar_agents
      JOBS_NETWORK: hangar_jobs
      DEFAULT_MODEL: ${DEFAULT_MODEL:-mock/echo}
      JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-180}
    ports:
      - "${CENTRAL_PORT:-8090}:8080"
    # agents_net: containers dos agentes (chat) e Postgres. jobs_net: callback dos containers de job, que
    # NÃO estão em agents_net. docker_api: só a central alcança o proxy do Docker.
    networks: [agents_net, jobs_net, docker_api, db_net]
    restart: unless-stopped

  # MCP server de análise de dados e entregáveis (Python/DuckDB/PPTX/dashboards) — opcional:
  #   docker compose --profile data-studio up -d --build data-studio
  # Agentes o usam em http://data-studio:8000/mcp; os links de download saem por DATA_STUDIO_PUBLIC_URL.
  data-studio:
    profiles: [data-studio]
    image: ${HANGAR_REGISTRY:-agent-hangar}/mcp-data-studio:${HANGAR_VERSION:-latest}
    build: ./mcp-servers/data-studio
    environment:
      PUBLIC_URL: ${DATA_STUDIO_PUBLIC_URL:-http://localhost:8095}
      MAX_FILE_MB: ${DATA_STUDIO_MAX_FILE_MB:-200}
      RETENTION_DAYS: ${DATA_STUDIO_RETENTION_DAYS:-30}
      OFFLINE_HTML: ${DATA_STUDIO_OFFLINE_HTML:-0}
      # process = kernel por sessão neste container (uid próprio); container = um sandbox Docker por sessão
      SANDBOX: ${DATA_STUDIO_SANDBOX:-process}
      SANDBOX_IMAGE: ${HANGAR_REGISTRY:-agent-hangar}/mcp-data-studio:${HANGAR_VERSION:-latest}
      SANDBOX_VOLUME: hangar_data_studio
      SANDBOX_NETWORK: hangar_sandbox
      SANDBOX_MEM: ${DATA_STUDIO_SANDBOX_MEM:-2g}
      DOCKER_HOST: tcp://data-studio-docker:2375
    volumes:
      - data_studio:/data
    ports:
      - "127.0.0.1:${DATA_STUDIO_PORT:-8095}:8001"   # só os downloads; o MCP (8000) fica na rede interna
    networks: [agents_net, sandbox_net, ds_docker_api]
    mem_limit: ${DATA_STUDIO_MEM:-4g}
    pids_limit: 1024
    cap_drop: [ALL]
    # o servidor só troca de uid para isolar as sessões (setpriv) e ajusta donos dos workspaces
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE, KILL]
    security_opt: [no-new-privileges]
    restart: unless-stopped

  # Docker (via proxy restrito a containers) só para o Data Studio criar os sandboxes por sessão (SANDBOX=container)
  data-studio-docker:
    profiles: [data-studio]
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      IMAGES: 0
      EXEC: 0
      BUILD: 0
      NETWORKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ds_docker_api]
    restart: unless-stopped

volumes:
  data_studio:
    name: hangar_data_studio   # nome fixo: os sandboxes montam subpastas dele
  pgdata:
    # instalações antigas (central-agents) reaproveitam o volume com PGDATA_VOLUME=central-agents_pgdata
    name: ${PGDATA_VOLUME:-agent-hangar_pgdata}

networks:
  agents_net:
    name: hangar_agents
  jobs_net:
    name: hangar_jobs
  docker_api:
    internal: true
  db_net:
    internal: true
  sandbox_net:
    name: hangar_sandbox       # sandboxes do Data Studio: saída para a internet, sem os agentes nem o banco
  ds_docker_api:
    internal: true
